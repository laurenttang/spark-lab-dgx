# Shared by master / workers / jupyter / portal
spark.master                      spark://spark-master:7077
# Master UI proxies worker + application UIs, served under /spark by Caddy
spark.ui.reverseProxy             true
spark.ui.reverseProxyUrl          /spark
# Keep finished-job UIs (DAG, stages) for the History Server
spark.eventLog.enabled            true
spark.eventLog.dir                file:/work/spark-events
spark.history.fs.logDirectory     file:/work/spark-events
spark.history.fs.cleaner.enabled  true
spark.history.fs.cleaner.maxAge   14d
# Sizing: worker has 10g = batch job 6g + 2 streams x 1g + jupyter 2g
spark.executor.memory             6g
spark.sql.shuffle.partitions      32
spark.sql.warehouse.dir           file:/work/warehouse
spark.sql.adaptive.enabled        true
# Wait until executors are up before the first task, so step timings are fair
spark.scheduler.minRegisteredResourcesRatio      1.0
spark.scheduler.maxRegisteredResourcesWaitingTime 30s
# Long-running streams: roll executor stdout/stderr at 10 MB, keep 3 files
spark.executor.logs.rolling.strategy          size
spark.executor.logs.rolling.maxSize           10485760
spark.executor.logs.rolling.maxRetainedFiles  3
