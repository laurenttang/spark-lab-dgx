# Spark Lab: the 2020 Spark course, revived on DGX Spark (aarch64)
# Usage:  docker compose up -d        (starts at boot via restart policy)
#         open http://<this-host>:${LAB_PORT}/   (login from .env)
name: sparklab

x-logging: &logging                      # the host never reboots: cap docker's json logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-spark: &spark
  image: spark-lab:4.1.2
  build: ./image
  restart: unless-stopped
  healthcheck: {disable: true}           # base image's check is for Jupyter only
  logging: *logging
  environment: &spark-env
    TZ: Asia/Taipei
    SPARK_NO_DAEMONIZE: "true"
    SPARK_WORKER_DIR: /tmp/spark-work      # executor stdout/stderr (ephemeral)
    SPARK_LOCAL_DIRS: /work/spark-local    # shuffle / spill on the big disk
    # workers delete finished apps' dirs after 3 days (checked hourly)
    SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=3600 -Dspark.worker.cleanup.appDataTtl=259200"
  volumes:
    - ../data:/data/course:ro                # course datasets (read-only; see NOTICE.md)
    - ../work:/work                          # outputs, event logs, big data
    - ./jobs:/opt/lab/jobs:ro                # rewritten course programs
    - ./conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
  networks: [lab]

services:
  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    mem_limit: 1g

  spark-worker-1: &worker
    <<: *spark
    hostname: spark-worker-1
    command: ["bash", "-c", "spark-class org.apache.spark.deploy.worker.Worker
               spark://spark-master:7077 --cores ${WORKER_CORES} --memory ${WORKER_MEMORY}
               --webui-port 8081"]
    depends_on: [spark-master]
    mem_limit: ${WORKER_MEM_LIMIT}

  spark-worker-2:
    <<: *worker
    hostname: spark-worker-2

  spark-history:
    <<: *spark
    hostname: spark-history
    environment:
      <<: *spark-env
      SPARK_HISTORY_OPTS: "-Dspark.ui.proxyBase=/history"
    command: ["spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    mem_limit: 2g

  jupyter:
    <<: *spark
    hostname: jupyter
    healthcheck: {disable: false}
    command: ["start-notebook.py", "--ServerApp.base_url=/jupyter",
              "--IdentityProvider.token=", "--ServerApp.password=",
              "--ServerApp.allow_remote_access=True", "--ServerApp.root_dir=/home/jovyan/work"]
    volumes:
      - ../data:/data/course:ro
      - ../work:/work
      - ./jobs:/opt/lab/jobs:ro
      - ./notebooks:/home/jovyan/work
      - ./conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
    mem_limit: 8g

  portal:
    <<: *spark
    hostname: portal
    command: ["uvicorn", "portal.app:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /opt/lab
    environment:
      <<: *spark-env
      DRIVER_MEMORY: ${DRIVER_MEMORY}
      WORKER_CORES: ${WORKER_CORES}
    volumes:
      - ../data:/data/course:ro
      - ../work:/work
      - ./jobs:/opt/lab/jobs:ro
      - ./portal:/opt/lab/portal:ro
      - ./conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ./image/rapids:/opt/rapids:ro          # RAPIDS Accelerator jar (cuda13-arm64), used by the ⑤ GPU job only
    depends_on: [spark-master, kafka]
    mem_limit: 24g                             # GPU job: local[16] driver 8g + pinned 4g + off-heap 6g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kafka:
    image: apache/kafka:4.3.2
    logging: *logging
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_MS: 3600000          # roll hourly, else data lives up to 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # and at most 1 GB per partition
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    mem_limit: 1g
    networks: [lab]

  caddy:
    image: caddy:2.10-alpine
    logging: *logging
    restart: unless-stopped
    ports:
      - "0.0.0.0:${LAB_PORT}:80"             # LAN access, password protected
    environment:
      LAB_USER: ${LAB_USER}
      LAB_PASSWORD_HASH: ${LAB_PASSWORD_HASH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [portal, jupyter, spark-master, spark-history]
    mem_limit: 256m
    networks: [lab]

networks:
  lab: {}
